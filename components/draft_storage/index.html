<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      const DEFAULT_STORAGE_KEY = "assimil-flashcard-draft-v1";
      let hasSentValue = false;
      let lastSentSignature;

      function send(type, data = {}) {
        window.parent.postMessage(
          { isStreamlitMessage: true, type, ...data },
          "*"
        );
      }

      function setValue(value) {
        const signature = JSON.stringify(value);
        if (hasSentValue && signature === lastSentSignature) return;
        hasSentValue = true;
        lastSentSignature = signature;
        send("streamlit:setComponentValue", { value });
      }

      function readStorage(key) {
        try {
          return localStorage.getItem(key);
        } catch (_) {
          return null;
        }
      }

      function readStorageResult(key) {
        try {
          return {
            status: "ready",
            value: localStorage.getItem(key),
          };
        } catch (error) {
          return {
            status: "error",
            value: null,
            message: error instanceof Error ? error.message : String(error),
          };
        }
      }

      function writeStorage(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch (_) {}
      }

      function removeStorage(key) {
        try {
          localStorage.removeItem(key);
        } catch (_) {}
      }

      window.addEventListener("message", event => {
        if (event.data?.type !== "streamlit:render") return;
        const args = event.data.args || {};
        const storageKey = typeof args.storage_key === "string"
          ? args.storage_key
          : DEFAULT_STORAGE_KEY;

        if (args.action === "clear") {
          removeStorage(storageKey);
          setValue(null);
        } else if (args.action === "write" && typeof args.draft === "string") {
          // The writer is intentionally one-way. Returning the whole draft to
          // Python here would cause an unnecessary app rerun after every edit.
          writeStorage(storageKey, args.draft);
        } else if (args.action === "read") {
          setValue(
            args.structured_result
              ? readStorageResult(storageKey)
              : readStorage(storageKey)
          );
        }
        send("streamlit:setFrameHeight", { height: 0 });
      });

      send("streamlit:componentReady", { apiVersion: 1 });
      send("streamlit:setFrameHeight", { height: 0 });
    </script>
  </head>
  <body></body>
</html>
