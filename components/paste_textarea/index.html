<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      const BUTTON_ID = "assimil-target-words-paste";
      let observer;

      function send(type, data = {}) {
        window.parent.postMessage(
          { isStreamlitMessage: true, type, ...data },
          "*"
        );
      }

      function setValue(value) {
        send("streamlit:setComponentValue", { value });
      }

      function requestId() {
        return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }

      function installButton(args) {
        const appDocument = window.parent.document;
        const textarea = Array.from(appDocument.querySelectorAll("textarea"))
          .find(element => element.getAttribute("aria-label") === args.textarea_label);
        if (!textarea) return false;

        appDocument.getElementById(BUTTON_ID)?.remove();

        const wrapper = textarea.parentElement;
        if (!wrapper) return false;
        wrapper.style.position = "relative";
        textarea.style.paddingRight = "3rem";

        const button = appDocument.createElement("button");
        button.id = BUTTON_ID;
        button.type = "button";
        button.innerHTML = `
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect x="6" y="5" width="12" height="16" rx="2"></rect>
            <path d="M9 5.5V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5"></path>
            <path d="M9 10h6M9 14h6M9 18h4"></path>
          </svg>
        `;
        button.setAttribute("aria-label", "Paste clipboard text into Target Words");
        button.title = "Paste from clipboard";
        button.style.cssText = `
          position: absolute;
          top: 0.4rem;
          right: 0.4rem;
          z-index: 2;
          display: grid;
          width: 2rem;
          height: 2rem;
          padding: 0;
          place-items: center;
          border: 0;
          border-radius: 0.35rem;
          background: transparent;
          color: #fff;
          cursor: pointer;
          touch-action: manipulation;
          user-select: none;
          -webkit-user-select: none;
          -webkit-touch-callout: none;
          -webkit-tap-highlight-color: transparent;
        `;
        const icon = button.querySelector("svg");
        icon.style.cssText = `
          display: block;
          fill: none;
          stroke: currentColor;
          stroke-width: 1.7;
          stroke-linecap: round;
          stroke-linejoin: round;
          pointer-events: none;
        `;

        let selectionStart = textarea.value.length;
        let selectionEnd = textarea.value.length;
        const rememberSelection = () => {
          selectionStart = textarea.selectionStart ?? textarea.value.length;
          selectionEnd = textarea.selectionEnd ?? selectionStart;
        };
        for (const eventName of ["click", "keyup", "select", "input"]) {
          textarea.addEventListener(eventName, rememberSelection);
        }

        // Keep the textarea's cursor position and suppress iOS's ordinary
        // text-selection callout when the icon itself is tapped.
        const suppressTextSelection = event => {
          event.preventDefault();
          event.stopPropagation();
        };
        button.addEventListener("pointerdown", suppressTextSelection);
        button.addEventListener("contextmenu", suppressTextSelection);
        button.addEventListener("click", async () => {
          const id = requestId();
          try {
            const clipboard = window.parent.navigator.clipboard;
            if (!clipboard?.readText) {
              throw new Error("Clipboard reading is unavailable");
            }
            const pastedText = await clipboard.readText();
            const currentValue = textarea.value;
            const nextValue =
              currentValue.slice(0, selectionStart)
              + pastedText
              + currentValue.slice(selectionEnd);

            // Show the result immediately; the component value then makes
            // Streamlit's Python and browser state authoritative on rerun.
            textarea.value = nextValue;
            const nextCursor = selectionStart + pastedText.length;
            textarea.setSelectionRange(nextCursor, nextCursor);
            setValue({ request_id: id, status: "success", value: nextValue });
          } catch (error) {
            setValue({
              request_id: id,
              status: "error",
              message: error instanceof Error ? error.message : String(error),
            });
          }
        });

        wrapper.appendChild(button);
        return true;
      }

      window.addEventListener("message", event => {
        if (event.data?.type !== "streamlit:render") return;
        const args = event.data.args || {};
        observer?.disconnect();

        if (!installButton(args)) {
          observer = new MutationObserver(() => {
            if (installButton(args)) observer.disconnect();
          });
          observer.observe(window.parent.document.body, {
            childList: true,
            subtree: true,
          });
        }
        send("streamlit:setFrameHeight", { height: 0 });
      });

      send("streamlit:componentReady", { apiVersion: 1 });
      send("streamlit:setFrameHeight", { height: 0 });
    </script>
  </head>
  <body></body>
</html>
