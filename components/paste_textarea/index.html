<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      const PASTE_BUTTON_ID = "assimil-target-words-paste";
      const TIDY_BUTTON_ID = "assimil-target-words-tidy";
      let observer;

      function send(type, data = {}) {
        window.parent.postMessage(
          { isStreamlitMessage: true, type, ...data },
          "*"
        );
      }

      function setValue(value) {
        send("streamlit:setComponentValue", { value });
      }

      function requestId() {
        return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }

      function installButton(args) {
        const appDocument = window.parent.document;
        const textarea = Array.from(appDocument.querySelectorAll("textarea"))
          .find(element => element.getAttribute("aria-label") === args.textarea_label);
        if (!textarea) return false;

        appDocument.getElementById(PASTE_BUTTON_ID)?.remove();
        appDocument.getElementById(TIDY_BUTTON_ID)?.remove();

        const wrapper = textarea.parentElement;
        const field = textarea.closest('[data-testid="stTextArea"]');
        if (!wrapper || !field) return false;
        wrapper.style.position = "relative";
        field.style.position = "relative";
        textarea.style.paddingRight = "3rem";

        const textColor = window.parent.getComputedStyle(textarea).color;

        const baseButtonStyles = `
          display: inline-flex;
          height: 2rem;
          padding: 0;
          align-items: center;
          justify-content: center;
          gap: 0.3rem;
          border: 0;
          border-radius: 0.35rem;
          background: transparent;
          color: ${textColor};
          font: inherit;
          font-size: 0.8rem;
          font-weight: 500;
          line-height: 1;
          cursor: pointer;
          touch-action: manipulation;
          user-select: none;
          -webkit-user-select: none;
          -webkit-touch-callout: none;
          -webkit-tap-highlight-color: transparent;
        `;

        const iconStyles = `
          display: block;
          flex: none;
          fill: none;
          stroke: currentColor;
          stroke-width: 1.7;
          stroke-linecap: round;
          stroke-linejoin: round;
          pointer-events: none;
        `;

        const tidyButton = appDocument.createElement("button");
        tidyButton.id = TIDY_BUTTON_ID;
        tidyButton.type = "button";
        tidyButton.innerHTML = `
          <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
            <path d="m12 3 1.15 3.1L16 7.25l-2.85 1.15L12 11.5l-1.15-3.1L8 7.25l2.85-1.15L12 3Z"></path>
            <path d="m18.5 12 .7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8Z"></path>
            <path d="m6 14 .9 2.1L9 17l-2.1.9L6 20l-.9-2.1L3 17l2.1-.9L6 14Z"></path>
          </svg>
          <span>Tidy notes</span>
        `;
        tidyButton.setAttribute("aria-label", "Tidy target-word notes with Gemini");
        tidyButton.title = "Tidy notes with Gemini";
        tidyButton.style.cssText = `
          ${baseButtonStyles}
          position: absolute;
          top: 0;
          right: 0.15rem;
          z-index: 2;
          height: 1.5rem;
          padding: 0 0.2rem;
        `;
        tidyButton.querySelector("svg").style.cssText = iconStyles;

        const pasteButton = appDocument.createElement("button");
        pasteButton.id = PASTE_BUTTON_ID;
        pasteButton.type = "button";
        pasteButton.innerHTML = `
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <rect x="6" y="5" width="12" height="16" rx="2"></rect>
            <path d="M9 5.5V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5"></path>
            <path d="M9 10h6M9 14h6M9 18h4"></path>
          </svg>
        `;
        pasteButton.setAttribute("aria-label", "Paste clipboard text into Target Words");
        pasteButton.title = "Paste from clipboard";
        pasteButton.style.cssText = `
          ${baseButtonStyles}
          position: absolute;
          top: 0.4rem;
          right: 0.4rem;
          z-index: 2;
          width: 2rem;
        `;
        pasteButton.querySelector("svg").style.cssText = iconStyles;

        let selectionStart = textarea.value.length;
        let selectionEnd = textarea.value.length;
        const rememberSelection = () => {
          selectionStart = textarea.selectionStart ?? textarea.value.length;
          selectionEnd = textarea.selectionEnd ?? selectionStart;
        };
        for (const eventName of ["click", "keyup", "select", "input"]) {
          textarea.addEventListener(eventName, rememberSelection);
        }

        // Keep the textarea's cursor position and suppress iOS's ordinary
        // text-selection callout when the icon itself is tapped.
        const suppressTextSelection = event => {
          event.preventDefault();
          event.stopPropagation();
        };
        for (const button of [tidyButton, pasteButton]) {
          button.addEventListener("pointerdown", suppressTextSelection);
          button.addEventListener("contextmenu", suppressTextSelection);
        }
        tidyButton.addEventListener("click", event => {
          event.stopPropagation();
          setValue({
            request_id: requestId(),
            action: "tidy",
            status: "requested",
            value: textarea.value,
          });
        });
        pasteButton.addEventListener("click", async event => {
          event.stopPropagation();
          const id = requestId();
          try {
            const clipboard = window.parent.navigator.clipboard;
            if (!clipboard?.readText) {
              throw new Error("Clipboard reading is unavailable");
            }
            const pastedText = await clipboard.readText();
            const currentValue = textarea.value;
            const nextValue =
              currentValue.slice(0, selectionStart)
              + pastedText
              + currentValue.slice(selectionEnd);

            // Show the result immediately; the component value then makes
            // Streamlit's Python and browser state authoritative on rerun.
            textarea.value = nextValue;
            const nextCursor = selectionStart + pastedText.length;
            textarea.setSelectionRange(nextCursor, nextCursor);
            setValue({ request_id: id, status: "success", value: nextValue });
          } catch (error) {
            setValue({
              request_id: id,
              status: "error",
              message: error instanceof Error ? error.message : String(error),
            });
          }
        });

        field.appendChild(tidyButton);
        wrapper.appendChild(pasteButton);
        return true;
      }

      window.addEventListener("message", event => {
        if (event.data?.type !== "streamlit:render") return;
        const args = event.data.args || {};
        observer?.disconnect();

        if (!installButton(args)) {
          observer = new MutationObserver(() => {
            if (installButton(args)) observer.disconnect();
          });
          observer.observe(window.parent.document.body, {
            childList: true,
            subtree: true,
          });
        }
        send("streamlit:setFrameHeight", { height: 0 });
      });

      send("streamlit:componentReady", { apiVersion: 1 });
      send("streamlit:setFrameHeight", { height: 0 });
    </script>
  </head>
  <body></body>
</html>
