name: Keep Streamlit App Awake

on:
  schedule:
    # Thirty minutes is comfortably below Streamlit Community Cloud's inactivity window.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.52.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Visit Streamlit app and wake it if needed
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          set -euo pipefail

          if [ -z "$STREAMLIT_APP_URL" ]; then
            echo "The STREAMLIT_APP_URL repository secret is not configured."
            exit 1
          fi

          node .github/scripts/keep_streamlit_awake.mjs

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-browser-diagnostics
          path: streamlit-debug.*
          if-no-files-found: ignore
