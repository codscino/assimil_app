name: Keep Streamlit App Awake

on:
  schedule:
    # Thirty minutes is comfortably below Streamlit Community Cloud's inactivity window.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.52.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Visit Streamlit app and wake it if needed
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          set -euo pipefail

          if [ -z "$STREAMLIT_APP_URL" ]; then
            echo "The STREAMLIT_APP_URL repository secret is not configured."
            exit 1
          fi

          node .github/scripts/keep_streamlit_awake.mjs
